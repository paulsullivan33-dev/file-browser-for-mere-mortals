site_name: File Browser for Mere Mortals
site_description: A web file manager that runs on your own server. Serving one folder tree through the browser with per-user scopes and permissions, share links with passwords and revocation, and a command runner that stays off until you switch it on, with the limits stated plainly.
site_url: https://paulsullivan33-dev.github.io/file-browser-for-mere-mortals/
